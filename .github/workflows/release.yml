name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version from tag
        shell: bash
        run: echo "PYGIFFER_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Stamp version into source
        run: python scripts/set_version.py "${{ github.ref_name }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm --clean pygiffer.spec

      - name: Stage release layout
        run: python scripts/post_build_layout.py

      - name: Package full zip (fresh-install download)
        shell: pwsh
        run: |
          $zip = "dist/pygiffer-${{ env.PYGIFFER_VERSION }}-windows.zip"
          Compress-Archive -Path "dist/pygiffer/*" -DestinationPath $zip -Force

      - name: Package layered update assets
        run: python scripts/package_release.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PyGiffer ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/pygiffer-${{ env.PYGIFFER_VERSION }}-windows.zip
            dist/pygiffer-app-*-windows.zip
            dist/pygiffer-deps-*-windows.zip
            dist/manifest.json
          generate_release_notes: true
